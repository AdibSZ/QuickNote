name: quicknote
description: "QuickNote - Hyper-fast Apple Glassmorphic Note Taking Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2
  quicknote_core:
    path: ../../packages/core/quicknote_core
  quicknote_storage:
    path: ../../packages/core/quicknote_storage
  quicknote_notes:
    path: ../../packages/features/quicknote_notes
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
